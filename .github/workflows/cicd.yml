name: Deploy Node Application

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kirtan330/reactjs-app:latest
          build-args: |
            REACT_APP_NODE_ENV=production
            REACT_APP_SERVER_BASE_URL=${{ secrets.REACT_APP_SERVER_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      - name: Pull image from docker hub
        run: docker pull kirtan330/reactjs-app:latest 
        
      - name: Stop and remove old container
        run: |
          docker stop reactjs-app-container || true
          docker rm reactjs-app-container || true
          
      - name: Run Docker Container
        run: docker run -d -p 3000:80 --name reactjs-app-container --restart unless-stopped kirtan330/reactjs-app:latest