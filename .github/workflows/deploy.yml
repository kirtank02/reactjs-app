name: Deploy Node Application

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kirtan330/reactjs-app:latest
          build-args: |
            REACT_APP_NODE_ENV=production
            REACT_APP_SERVER_BASE_URL=${{ secrets.REACT_APP_SERVER_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      - name: Check Docker installation
        run: |
          docker --version
          docker info
      
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Pull latest image
        run: docker pull kirtan330/reactjs-app:latest
      
      - name: List existing containers
        run: docker ps -a
      
      - name: Stop and remove old container
        run: |
          if docker ps -q -f name=reactjs-app-container; then
            echo "Stopping existing container..."
            docker stop reactjs-app-container
            docker rm reactjs-app-container
          else
            echo "No existing container found"
          fi
      
      - name: Remove old images (optional cleanup)
        run: |
          docker image prune -f
      
      - name: Run new container
        run: |
          docker run -d \
            --name reactjs-app-container \
            -p 3000:80 \
            --restart unless-stopped \
            kirtan330/reactjs-app:latest
      
      - name: Verify container is running
        run: |
          sleep 5
          docker ps
          docker logs reactjs-app-container
      
      - name: Test application health
        run: |
          sleep 10
          curl -f http://localhost:3000 || echo "Application not responding yet"