name: Deploy Node Application

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}     
      
      - name: Build Docker Image
        run: docker build -t kirtan330/reactjs-app:latest --build-arg REACT_APP_NODE_ENV='production' --build-arg REACT_APP_SERVER_BASE_URL='${{ secrets.REACT_APP_SERVER_BASE_URL }}'  .
      
      - name: Publish Image to docker hub
        run: docker push kirtan330/reactjs-app:latest 
 
  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      - name: Pull image from docker hub
        run: docker pull kirtan330/reactjs-app:latest 
      
      - name: Stop and remove old container
        run: |
          docker stop reactjs-app-container || true
          docker rm reactjs-app-container || true
      
      - name: Run Docker Container
        run: docker run -d -p 3000:80 --name reactjs-app-container --restart unless-stopped kirtan330/reactjs-app:latest